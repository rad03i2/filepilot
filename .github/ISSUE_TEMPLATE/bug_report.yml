name: Bug report
description: Report a reproducible FilePilot problem using sanitized or temporary files.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please use temporary/generated files when possible. Do not upload personal documents, credentials, or sensitive paths.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu / macOS"
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command
      options:
        - plan
        - organize
        - undo
        - hash
        - installation / packaging
        - other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Prefer a temporary folder structure and sanitized file names.
    validations:
      required: true
